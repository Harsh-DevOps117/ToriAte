name: tori

x-n8n-env: &n8n-env
  TZ: ${TZ}
  GENERIC_TIMEZONE: ${TZ}
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_HOST: ${N8N_HOST}
  N8N_WEBHOOK_URL: ${WEBHOOK_URL}
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "336"
  LLM_BASE_URL: ${LLM_BASE_URL}
  LLM_MODEL: ${LLM_MODEL}
  GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI}
  GCAL_BASE_URL: ${GCAL_BASE_URL}
  WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
  WHATSAPP_MODE: ${WHATSAPP_MODE}
  WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TORI_DB_PASSWORD: ${TORI_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -U postgres && psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname=''n8n''" | grep -q 1',
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  db-migrate:
    image: postgres:17-alpine
    environment:
      TORI_DB_PASSWORD: ${TORI_DB_PASSWORD}
      SEED_DEV: ${SEED_DEV:-0}
    volumes:
      - ./db/migrate.sh:/migrate.sh:ro,z
      - ./db/migrations:/migrations:ro,z
      - ./db/seed:/seed:ro,z
    entrypoint: ["/bin/sh", "/migrate.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  mock-apis:
    image: node:22-alpine
    profiles: ["mock"]
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      TZ: ${TZ}
      PORT: "8090"
    volumes:
      - ./mock-apis:/app:ro,z
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  n8n-bootstrap:
    image: n8nio/n8n:2.41.3
    environment:
      <<: *n8n-env
      TORI_DB_PASSWORD: ${TORI_DB_PASSWORD}
      INBOUND_WEBHOOK_USER: ${INBOUND_WEBHOOK_USER}
      INBOUND_WEBHOOK_PASSWORD: ${INBOUND_WEBHOOK_PASSWORD}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/opt/tori/n8n:ro,z
    entrypoint: ["/bin/sh", "/opt/tori/n8n/bootstrap/bootstrap.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  n8n:
    image: n8nio/n8n:2.41.3
    restart: unless-stopped
    environment:
      <<: *n8n-env
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${GOOGLE_SERVICE_ACCOUNT_JSON_B64}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./n8n:/opt/tori/n8n:ro,z
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      n8n-bootstrap:
        condition: service_completed_successfully

  n8n-owner:
    image: n8nio/n8n:2.41.3
    environment:
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD}
      N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME}
      N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME}
    volumes:
      - ./n8n/bootstrap/setup-owner.js:/setup-owner.js:ro,z
    entrypoint: ["node", "/setup-owner.js"]
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
